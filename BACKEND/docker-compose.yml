
services:
  # Nginx reverse proxy
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: de_an_nginx
    ports:
      - "8090:8090"
    depends_on:
      - auth
      - be_admin
      - be_chatbot
      - be_preprocess
      - ml
    networks:
      - de_an_network
    restart: unless-stopped

  auth:
    build:
      context: ./AUTH
      dockerfile: Dockerfile
    container_name: de_an_auth
    env_file:
      - ./AUTH/.env.docker.docker
    # No public port mapping - only accessible through nginx
    expose:
      - "8888"
    volumes:
      - sqlite_data:/app/data  # Shared SQLite volume
    networks:
      - de_an_network
    restart: unless-stopped

  be_admin:
    build:
      context: ./BE_ADMIN
      dockerfile: Dockerfile
    container_name: de_an_admin
    env_file:
      - ./BE_ADMIN/.env.docker
    # No public port mapping - only accessible through nginx
    expose:
      - "8888"
    networks:
      - de_an_network
    restart: unless-stopped

  be_chatbot:
    build:
      context: ./BE_CHATBOT
      dockerfile: Dockerfile
    container_name: de_an_chatbot
    env_file:
      - ./BE_CHATBOT/.env.docker
    # No public port mapping - only accessible through nginx
    expose:
      - "8888"
    volumes:
      - sqlite_data:/app/data  # Shared SQLite volume
    networks:
      - de_an_network
    restart: unless-stopped

  be_preprocess:
    build:
      context: ./BE_PREPROCESS
      dockerfile: Dockerfile
    container_name: de_an_preprocess
    env_file:
      - ./BE_PREPROCESS/.env.docker
    # No public port mapping - only accessible through nginx
    expose:
      - "8888"
    networks:
      - de_an_network
    restart: unless-stopped

  ml:
    build:
      context: ./ML
      dockerfile: Dockerfile
    container_name: de_an_ml
    env_file:
      - ./ML/.env.docker
    # No public port mapping - only accessible through nginx
    expose:
      - "8888"
    networks:
      - de_an_network
    restart: unless-stopped

networks:
  de_an_network:
    driver: bridge

volumes:
  sqlite_data:
    driver: local
