services:
  # API Gateway
  nginx:
    build:
      context: ./BACKEND/nginx
      dockerfile: Dockerfile
    container_name: de_an_nginx
    ports:
      - "8090:8090"  # Single entry point for all backend services
    depends_on:
      - auth
      - be_admin
      - be_chatbot
      - be_preprocess
      - ml
    networks:
      - de_an_network
    restart: unless-stopped

  # Backend Services
  auth:
    build:
      context: ./BACKEND/AUTH
      dockerfile: Dockerfile
    container_name: de_an_auth
    expose:
      - "8888"  # Only exposed to internal network
    volumes:
      - ./BACKEND/AUTH/app:/app/app
      - ./BACKEND/AUTH/config:/app/config
      - ./BACKEND/AUTH/logs:/app/logs
      - ./BACKEND/shared_data:/app/data  # Shared database (SQLite)
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - SQLITE_DB_PATH=/app/data/auth.db  # SQLite database path (maps to C:\Users\Admin\Desktop\DE_AN\BACKEND\shared_data\auth.db on host)
    networks:
      - de_an_network
    restart: unless-stopped

  be_admin:
    build:
      context: ./BACKEND/BE_ADMIN
      dockerfile: Dockerfile
    container_name: de_an_admin
    expose:
      - "8888"  # Only exposed to internal network
    volumes:
      - ./BACKEND/BE_ADMIN/app:/app/app
      - ./BACKEND/BE_ADMIN/config:/app/config
      - ./BACKEND/BE_ADMIN/logs:/app/logs
      - ./BACKEND/shared_data:/app/data  # Shared database
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - SQLITE_DB_PATH=/app/data/auth.db  # SQLite database path (maps to C:\Users\Admin\Desktop\DE_AN\BACKEND\shared_data\auth.db on host)
    networks:
      - de_an_network
    restart: unless-stopped

  be_chatbot:
    build:
      context: ./BACKEND/BE_CHATBOT
      dockerfile: Dockerfile
    container_name: de_an_chatbot
    expose:
      - "8888"  # Only exposed to internal network
    volumes:
      - ./BACKEND/BE_CHATBOT/app:/app/app
      - ./BACKEND/BE_CHATBOT/config:/app/config
      - ./BACKEND/BE_CHATBOT/logs:/app/logs
      - ./BACKEND/shared_data:/app/data  # Shared database
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - SQLITE_DB_PATH=/app/data/auth.db  # SQLite database path (maps to C:\Users\Admin\Desktop\DE_AN\BACKEND\shared_data\auth.db on host)
    networks:
      - de_an_network
    restart: unless-stopped

  be_preprocess:
    build:
      context: ./BACKEND/BE_PREPROCESS
      dockerfile: Dockerfile
    container_name: de_an_preprocess
    expose:
      - "8888"  # Only exposed to internal network
    volumes:
      - ./BACKEND/BE_PREPROCESS/app:/app/app
      - ./BACKEND/BE_PREPROCESS/config:/app/config
      - ./BACKEND/BE_PREPROCESS/logs:/app/logs
      - ./BACKEND/shared_data:/app/data  # Shared database
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - SQLITE_DB_PATH=/app/data/auth.db  # SQLite database path (maps to C:\Users\Admin\Desktop\DE_AN\BACKEND\shared_data\auth.db on host)
    networks:
      - de_an_network
    restart: unless-stopped

  ml:
    build:
      context: ./BACKEND/ML
      dockerfile: Dockerfile
    container_name: de_an_ml
    expose:
      - "8888"  # Only exposed to internal network
    volumes:
      - ./BACKEND/ML/artifacts:/app/artifacts
      - ./BACKEND/ML/logs:/app/logs
      - ./BACKEND/ML/plots:/app/plots
      - ./BACKEND/shared_data:/app/data  # Shared database (maps to SQLITE_DB_PATH)
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - SQLITE_DB_PATH=/app/data/auth.db  # SQLite database path (maps to C:\Users\Admin\Desktop\DE_AN\BACKEND\shared_data\auth.db on host)
    networks:
      - de_an_network
    restart: unless-stopped
    
  # Frontend service
  frontend:
    build:
      context: ./FRONTEND
      dockerfile: Dockerfile
    container_name: de_an_frontend
    ports:
      - "3000:80"  # Map host port 3000 to container port 80 (nginx)
    environment:
      - NODE_ENV=production
      - REACT_APP_API_URL=http://localhost:8090  # Points to the API gateway
    networks:
      - de_an_network
    depends_on:
      - nginx
    restart: unless-stopped

networks:
  de_an_network:
    driver: bridge

volumes:
  auth_logs:
  admin_logs:
  chatbot_logs:
  preprocess_logs:
  ml_artifacts:
  ml_logs:
  ml_plots:
  shared_data:  # Persistent shared database volume 